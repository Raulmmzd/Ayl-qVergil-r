<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aylıq vergi ödəyənlər</title>
<style>
:root{--bg:#eef2f0;--card:#fff;--ink:#1c2b27;--mute:#5f7069;--line:#d5ded9;--acc:#1d6b57;--acc2:#e6f2ee;--red:#b3392f}
@media(prefers-color-scheme:dark){:root{--bg:#121a17;--card:#1a2420;--ink:#e6efeb;--mute:#93a59d;--line:#2c3a34;--acc:#4fb597;--acc2:#20342d;--red:#e57b70}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px;font-family:system-ui,sans-serif;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
label{display:block;font:600 .8rem system-ui,sans-serif;color:var(--mute);margin-bottom:4px}
input{display:block;width:100%;min-width:0;max-width:100%;height:44px;-webkit-appearance:none;appearance:none;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:1rem system-ui,sans-serif}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.grid>*{min-width:0}
.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;align-items:end}
@media(max-width:700px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid .full{grid-column:1/-1}.bar .m{min-width:0;width:100%}.bar>div{width:100%}.bar button{flex:1 1 100%}.tot b{font-size:1.2rem}}
input[type=date],input[type=month]{text-align:left;line-height:1.2}
input::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
button{min-height:44px}
button{padding:10px 16px;border:0;border-radius:6px;background:var(--acc);color:#fff;font:600 .95rem system-ui,sans-serif;cursor:pointer}
button.alt{background:var(--acc2);color:var(--acc);border:1px solid var(--line)}
button.del{background:none;color:var(--red);padding:4px 8px;min-height:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.bar .m{min-width:200px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-family:system-ui,sans-serif;font-size:.95rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-size:.8rem}
td.n,th.n{text-align:right}
td:nth-child(2){white-space:normal;min-width:130px}
.empty{color:var(--mute);text-align:center;padding:22px;font-family:system-ui,sans-serif}
.tot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:14px}
.tot div{background:var(--acc2);border-radius:8px;padding:12px 14px;font-family:system-ui,sans-serif}
.tot span{display:block;color:var(--mute);font-size:.8rem}
.tot b{font:700 1.5rem Georgia,serif;color:var(--acc)}
.note{color:var(--mute);font:.8rem system-ui,sans-serif;margin-top:6px}
@media(max-width:700px){.bar .m{min-width:0;width:100%}.tot b{font-size:1.2rem}.card{padding:12px}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov[hidden]{display:none}
.box{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:420px;width:100%;max-height:85vh;overflow:auto}
.box h2{font-size:1.1rem;margin:0 0 10px}
#dupL{font-family:system-ui,sans-serif;font-size:.9rem}
#dupL div{padding:8px 0;border-bottom:1px solid var(--line)}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1}
</style>
</head>
<body>
<div class="wrap">
<h1>Aylıq vergi ödəyənlər</h1>
<p class="sub">Məlumatlar bu cihazın brauzerində saxlanılır. Ehtiyat üçün vaxtaşırı Excel-ə ixrac edin.</p>

<div class="card bar">
  <div class="m"><label for="month">Ay seçin</label><input type="month" id="month"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="alt" id="expM">Bu ayı Excel-ə çıxar</button>
    <button class="alt" id="expA">Bütün ayları Excel-ə çıxar</button>
  </div>
</div>

<div class="card">
  <div class="grid">
    <div class="full"><label for="fio">Soyad Ad Ata adı</label><input id="fio" autocomplete="off"></div>
    <div><label for="dt">Ödəniş vaxtı</label><input type="date" id="dt"></div>
    <div><label for="am">Məbləğ (₼)</label><input type="number" id="am" min="0" step="0.01" inputmode="decimal"></div>
    <div class="full"><button id="add">Əlavə et</button></div>
  </div>
  <p class="note" id="err" style="color:var(--red)"></p>
</div>

<div class="card">
  <div class="tw">
    <table>
      <thead><tr><th>№</th><th>Soyad Ad Ata adı</th><th>Ödəniş vaxtı</th><th class="n">Məbləğ</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="tot">
    <div><span>Aylıq ümumi məbləğ</span><b id="sum">0.00</b> ₼</div>
    <div><span>Ümumi məbləğin 5%-i</span><b id="pct">0.00</b> ₼</div>
  </div>
</div>
</div>

<div id="dup" class="ov" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="dupT">
    <h2 id="dupT">Bu ad artıq qeyd olunub</h2>
    <div id="dupL"></div>
    <div class="acts"><button class="alt" id="dupNo">Ləğv et</button><button id="dupYes">Yenə də əlavə et</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const KEY="vergi_odeyenler_v1";
const AZ=["Yanvar","Fevral","Mart","Aprel","May","İyun","İyul","Avqust","Sentyabr","Oktyabr","Noyabr","Dekabr"];
const $=id=>document.getElementById(id);
let db={};
try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){db={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){$("err").textContent="Brauzer yaddaşa yazmağa icazə vermir."}};
const fmt=n=>n.toLocaleString("az-AZ",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const full=r=>r.fio||[r.sn,r.nm,r.fn].filter(Boolean).join(" ");
const fdate=d=>d?d.split("-").reverse().join("."):"";
const now=new Date();
$("month").value=localStorage.getItem(KEY+"_m")||`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;

function setDateLimits(){
  const m=$("month").value; if(!m)return;
  const [y,mo]=m.split("-").map(Number);
  const last=new Date(y,mo,0).getDate();
  $("dt").min=m+"-01"; $("dt").max=m+"-"+String(last).padStart(2,"0");
  if($("dt").value && $("dt").value.slice(0,7)!==m) $("dt").value="";
}
function render(){
  const m=$("month").value; setDateLimits();
  try{localStorage.setItem(KEY+"_m",m)}catch(e){}
  const list=db[m]||[];
  $("rows").innerHTML=list.length?list.map((r,i)=>
    `<tr><td>${i+1}</td><td>${esc(full(r))}</td><td>${fdate(r.dt)}</td><td class="n">${fmt(r.am)}</td><td><button class="del" data-i="${i}" aria-label="Sil">Sil</button></td></tr>`).join("")
    :`<tr><td colspan="7" class="empty">Bu ay üçün qeyd yoxdur. Yuxarıdakı formadan əlavə edin.</td></tr>`;
  const s=list.reduce((a,r)=>a+r.am,0);
  $("sum").textContent=fmt(s); $("pct").textContent=fmt(s*0.05);
}
$("month").addEventListener("change",render);
const fold=s=>s.toLocaleLowerCase("az").replace(/\u0307/g,"").replace(/[əǝ]/g,"e").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ç/g,"c").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/\s+/g," ").trim();
function findDup(fio){
  const k=fold(fio), out=[];
  Object.keys(db).sort().forEach(m=>(db[m]||[]).forEach(r=>{if(fold(full(r))===k)out.push({m,r})}));
  return out;
}
function addRec(m,fio,dt,am){
  (db[m]=db[m]||[]).push({fio,dt,am});
  save(); ["fio","am"].forEach(i=>$(i).value=""); render(); $("fio").focus();
}
let pend=null;
function closeDup(){$("dup").hidden=true;pend=null}
function showDup(d,p){
  pend=p;
  const sh=d.slice(0,5).map(x=>`<div><b>${esc(full(x.r))}</b><br>${title(x.m)} · ${fdate(x.r.dt)} · ${fmt(x.r.am)} ₼</div>`).join("");
  $("dupL").innerHTML=`<p style="margin:0 0 8px">Daxil etdiyiniz ad əvvəl də qeyd olunub (${d.length} dəfə):</p>${sh}${d.length>5?`<div>... və daha ${d.length-5} qeyd</div>`:""}`;
  $("dup").hidden=false;
}
$("dupNo").addEventListener("click",closeDup);
$("dupYes").addEventListener("click",()=>{if(pend){const p=pend;closeDup();addRec(p.m,p.fio,p.dt,p.am)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("dup").hidden)closeDup()});
$("add").addEventListener("click",()=>{
  const m=$("month").value, fio=$("fio").value.trim().replace(/\s+/g," "), dt=$("dt").value, am=parseFloat($("am").value);
  if(!m){$("err").textContent="Əvvəlcə ay seçin.";return}
  if(!fio||!dt||isNaN(am)){$("err").textContent="Soyad Ad Ata adı, tarix və məbləği doldurun.";return}
  $("err").textContent="";
  const d=findDup(fio);
  if(d.length){showDup(d,{m,fio,dt,am});return}
  addRec(m,fio,dt,am);
});
$("rows").addEventListener("click",e=>{
  const b=e.target.closest(".del"); if(!b)return;
  const m=$("month").value, r=db[m][b.dataset.i];
  if(confirm(`${full(r)} qeydi silinsin?`)){db[m].splice(b.dataset.i,1);save();render()}
});
["fio","dt","am"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")$("add").click()}));

function sheetFor(m){
  const list=db[m]||[], s=list.reduce((a,r)=>a+r.am,0);
  const rows=[["№","Soyad Ad Ata adı","Ödəniş vaxtı","Məbləğ (₼)"]];
  list.forEach((r,i)=>rows.push([i+1,full(r),fdate(r.dt),r.am]));
  rows.push([],["","","Ümumi məbləğ",Math.round(s*100)/100],["","","5%",Math.round(s*5)/100]);
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"]=[{wch:5},{wch:40},{wch:16},{wch:14}];
  return ws;
}
const title=m=>{const [y,mo]=m.split("-");return `${AZ[mo-1]} ${y}`};
function exp(all){
  if(typeof XLSX==="undefined"){alert("Excel kitabxanası yüklənmədi. İnternet bağlantısını yoxlayın.");return}
  const wb=XLSX.utils.book_new();
  const months=all?Object.keys(db).filter(k=>db[k].length).sort():[$("month").value];
  if(!months.length){alert("İxrac üçün qeyd yoxdur.");return}
  months.forEach(m=>XLSX.utils.book_append_sheet(wb,sheetFor(m),title(m)));
  XLSX.writeFile(wb,all?"vergi_butun_aylar.xlsx":`vergi_${months[0]}.xlsx`);
}
$("expM").addEventListener("click",()=>exp(false));
$("expA").addEventListener("click",()=>exp(true));
render();
</script>
</body>
</html>
